name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.85.0']
        features: ['', rdma, cuda, 'rdma,cuda', io-uring, 'cuda,io-uring', 'rdma,cuda,io-uring', gds, 'gds,io-uring', 'rdma,cuda,io-uring,gds', metrics, 'rdma,cuda,io-uring,gds,metrics', rdma-adaptive, 'rdma,cuda,io-uring,gds,metrics,rdma-adaptive', fabric, 'rdma,cuda,io-uring,gds,metrics,rdma-adaptive,fabric']
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      ORBITE_FEATURES: ${{ matrix.features }}
      CC: gcc
      CXX: g++
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CLANG_PATH: /usr/bin/clang-18
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Install RDMA binding prerequisites
        if: contains(matrix.features, 'rdma')
        timeout-minutes: 10
        run: .github/scripts/install-native-deps.sh g++ cmake pkg-config clang-18 libclang-18-dev libibverbs-dev
      - name: Install the required real libfabric TCP provider
        if: contains(matrix.features, 'fabric')
        run: |
          .github/scripts/install-native-deps.sh g++ clang-18 libclang-18-dev libfabric-dev libfabric-bin
          echo "FI_PROVIDER=tcp" >> "$GITHUB_ENV"
          echo "ORBITE_REQUIRE_FABRIC=1" >> "$GITHUB_ENV"
          FI_PROVIDER=tcp fi_info -p 'tcp;ofi_rxm' -t FI_EP_RDM
      - name: Verify the shipped local-copy PTX with the generating compiler
        if: matrix.toolchain == 'stable' && matrix.features == 'cuda'
        run: |
          command -v clang++-19 || .github/scripts/install-native-deps.sh clang-19
          cd src/cuda/local_copy
          clang++-19 -x cuda --cuda-device-only --cuda-gpu-arch=sm_52 -nocudainc -nocudalib -O3 -S kernel.cu -o "$RUNNER_TEMP/kernel.ptx"
          diff -u kernel.ptx "$RUNNER_TEMP/kernel.ptx"
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --locked --features "$ORBITE_FEATURES"
      - name: Check portable build and Linux-only features
        if: matrix.features == ''
        run: |
          target=aarch64-apple-darwin
          rustup target add "$target"
          cargo check --locked --target "$target" --no-default-features
          for features in rdma cuda rdma,cuda io-uring cuda,io-uring rdma,cuda,io-uring gds gds,io-uring rdma,cuda,io-uring,gds rdma-adaptive fabric; do
            log="$RUNNER_TEMP/non-linux-$features.log"
            if cargo check --locked --target "$target" --features "$features" >"$log" 2>&1; then
              echo "unexpected success for $target with $features"
              exit 1
            fi
            if ! grep -Eq '^error: OrbiTE.*features require a Linux target$' "$log" || grep -q '^error\[' "$log"; then
              cat "$log"
              exit 1
            fi
          done
      - name: Check file provider isolation
        if: "!contains(matrix.features, 'io-uring')"
        run: |
          cargo tree --locked --features "$ORBITE_FEATURES" -e normal,build > "$RUNNER_TEMP/deps.txt"
          if grep -F 'io-uring v' "$RUNNER_TEMP/deps.txt"; then exit 1; fi
      - name: Prepare real ext4 and tmpfs for file providers
        if: contains(matrix.features, 'io-uring') || contains(matrix.features, 'gds')
        run: |
          if [[ "$ORBITE_FEATURES" == *io-uring* ]] && test -e /proc/sys/kernel/io_uring_disabled; then sudo sysctl -w kernel.io_uring_disabled=0; fi
          ext="$RUNNER_TEMP/orbite-ext4"
          mkdir -p "$ext"
          if test "$(findmnt -n -o FSTYPE -T "$ext")" != ext4; then
            truncate -s 64M "$RUNNER_TEMP/ext4.img"
            mkfs.ext4 -q -F "$RUNNER_TEMP/ext4.img"
            sudo mount -o loop "$RUNNER_TEMP/ext4.img" "$ext"
            sudo chown "$(id -u):$(id -g)" "$ext"
          fi
          test "$(findmnt -n -o FSTYPE -T "$ext")" = ext4
          test "$(findmnt -n -o FSTYPE -T /dev/shm)" = tmpfs
          echo "ORBITE_EXT4_DIR=$ext" >> "$GITHUB_ENV"
          echo "ORBITE_TMPFS_DIR=/dev/shm" >> "$GITHUB_ENV"
          if [[ "$ORBITE_FEATURES" == *io-uring* ]]; then echo "ORBITE_REQUIRE_IO_URING=1" >> "$GITHUB_ENV"; fi
      - name: Build the P10 native GDS gate without running it
        if: matrix.features == 'gds'
        run: python3 tests/hardware/build_installed.py --consumer gds-p10 --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/gds-p10-installed"
      - name: Clippy
        run: cargo clippy --workspace --locked --features "$ORBITE_FEATURES" --all-targets -- -D warnings
      - name: Set the same test parallelism for the suite and stability controls
        if: matrix.toolchain == 'stable' && (matrix.features == 'rdma,cuda,io-uring' || matrix.features == 'rdma,cuda,io-uring,gds' || matrix.features == 'rdma,cuda,io-uring,gds,metrics')
        run: echo "RUST_TEST_THREADS=$(nproc)" >> "$GITHUB_ENV"
      - name: Test CPU TCP and ownership
        run: cargo test --workspace --locked --features "$ORBITE_FEATURES"
      - name: P10 CPU fault matrix and real peer kills
        if: matrix.features == 'rdma,cuda,io-uring,gds,metrics,rdma-adaptive,fabric'
        run: |
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          python3 tests/faults/run.py --binary "$binary" --output "$RUNNER_TEMP/p10-cpu" --kill-repeats 50
      - name: Preserve P10 CPU fault evidence
        if: always() && matrix.features == 'rdma,cuda,io-uring,gds,metrics,rdma-adaptive,fabric'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: p10-cpu-${{ matrix.toolchain }}
          path: ${{ runner.temp }}/p10-cpu/
      - name: Repeat fabric ownership and real-process controls
        if: matrix.features == 'fabric'
        run: |
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          bash .github/scripts/repeat-fabric.sh "$binary" "$RUNNER_TEMP/fabric-repeats"
          if ldd "$binary" | grep -F libfabric; then exit 1; fi
          python3 tests/hardware/build_installed.py --consumer fabric --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/fabric-installed"
      - name: Repeat guarded restart port ownership at suite parallelism
        if: matrix.features == ''
        run: |
          binary=$(cargo test --locked --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          for i in $(seq 1 200); do
            RUST_TEST_THREADS=$(nproc) "$binary" --exact engine::failover::tests::foreground_and_worker_describe_a_same_port_restart_only_with_its_new_epoch > "$RUNNER_TEMP/restart-port.log" 2>&1 || { cat "$RUNNER_TEMP/restart-port.log"; exit 1; }
            grep -F "test result: ok. 1 passed; 0 failed;" "$RUNNER_TEMP/restart-port.log"
          done
      - name: Install the offline diagnostics CLI (no engine or network)
        if: matrix.features == ''
        run: |
          if ! command -v strace >/dev/null; then .github/scripts/install-native-deps.sh strace; fi
          bash .github/scripts/check-installed-diagnostics.sh "$RUNNER_TEMP/offline-diagnostics"
      - name: Build the peer GPU TCP gate without running it
        if: matrix.features == 'cuda'
        run: |
          for role in source requester; do
            python3 tests/hardware/build_installed.py --consumer "peer-gpu-$role" --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/peer-gpu-$role"
          done
      - name: Build the packaged staging control and mixed GPU gates
        if: matrix.features == 'rdma,cuda'
        run: |
          for consumer in staging-control mixed-gpu; do
            python3 tests/hardware/build_installed.py --consumer "$consumer" --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/$consumer-$RUSTUP_TOOLCHAIN"
          done
      - name: Repeat lane, CPU-only requester and accounting controls 50 times
        if: matrix.toolchain == 'stable' && matrix.features == 'rdma,cuda,io-uring,gds,metrics,rdma-adaptive'
        run: bash .github/scripts/repeat-tcp-observability.sh "$RUNNER_TEMP/r1d-iteration.log"
      - name: Run the two-process HP-TCP loopback consumer
        if: matrix.features == ''
        run: |
          installed="$RUNNER_TEMP/orbite-installed-hp-tcp"
          python3 tests/hardware/build_installed.py --consumer hp-tcp --toolchain "$RUSTUP_TOOLCHAIN" --output "$installed"
          python3 "$installed/hp_tcp_run.py" --loopback --binary "$installed/installed/bin/orbite-hp-tcp"
      - name: Install and exercise same-host SHM with POSIX names and a tmpfs directory
        if: matrix.features == ''
        run: |
          installed="$RUNNER_TEMP/orbite-installed-shm"
          python3 tests/hardware/build_installed.py --consumer shm --toolchain "$RUSTUP_TOOLCHAIN" --output "$installed"
          standin=$(mktemp -d /dev/shm/orbite-cxl-XXXXXX)
          trap 'rmdir "$standin"' EXIT
          python3 "$installed/shm_run.py" --binary "$installed/installed/bin/orbite-shm" --posix
          python3 "$installed/shm_run.py" --binary "$installed/installed/bin/orbite-shm" --tmpfs "$standin"
      - name: Repeat RDMA release controls with suite parallelism
        if: matrix.toolchain == 'stable' && matrix.features == 'rdma,cuda,io-uring,gds,metrics,rdma-adaptive'
        run: |
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          s15=(gpu_source_reuse:: named_gpu_key private_gpu_grants_drain_in_order)
          test "$("$binary" "${s15[@]}" --list | awk '/: test$/ {n++} END {print n+0}')" -eq 8
          filters=(r1b_ adaptive_congestion_control::tests:: poll_retirement_keeps_native_owners device_teardown_failures_are_retained partial_retirement_distinguishes_closed "${s15[@]}")
          count=$("$binary" "${filters[@]}" --list | awk '/: test$/ {n++} END {print n+0}')
          test "$count" -ge 17
          for i in $(seq 1 50); do
            RUST_TEST_THREADS=$(nproc) "$binary" "${filters[@]}" > "$RUNNER_TEMP/r1b.log" || { cat "$RUNNER_TEMP/r1b.log"; exit 1; }
            grep -F "test result: ok. $count passed; 0 failed;" "$RUNNER_TEMP/r1b.log"
          done
      - name: Repeat peer retirement owner controls 50 times
        if: matrix.toolchain == 'stable' && matrix.features == 'rdma,cuda,io-uring,gds,metrics,rdma-adaptive'
        run: |
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          bash .github/scripts/repeat-peer-retirement.sh "$binary" "$RUNNER_TEMP/peer-retirement"
      - name: Build the packaged peer retirement gate without running hardware
        if: matrix.features == 'rdma,cuda'
        run: python3 tests/hardware/build_installed.py --consumer peer-retirement --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/peer-retirement-installed"
      - name: Repeat storage and CUDA release controls 50 times
        if: matrix.toolchain == 'stable' && matrix.features == 'rdma,cuda,io-uring,gds,metrics,rdma-adaptive'
        run: |
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          bash .github/scripts/repeat-storage-cuda.sh "$binary" "$RUNNER_TEMP/r1c-repeats"
      - name: Repeat MNNVL fabric and EGM shim controls 50 times
        if: matrix.toolchain == 'stable' && (matrix.features == 'cuda' || matrix.features == 'rdma,cuda,io-uring,gds,metrics')
        run: |
          set -o pipefail
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          count=$("$binary" --list | awk '/^cuda::tests::fabric::.*: test$/ {n++} END {print n+0}')
          test "$count" -ge 17
          for i in $(seq 1 50); do
            RUST_TEST_THREADS=$(nproc) "$binary" cuda::tests::fabric:: > "$RUNNER_TEMP/mnnvl.log" || { cat "$RUNNER_TEMP/mnnvl.log"; exit 1; }
            grep -F "test result: ok. $count passed; 0 failed;" "$RUNNER_TEMP/mnnvl.log"
          done
      - name: Build packaged MNNVL and EGM consumer
        if: matrix.features == 'cuda'
        run: python3 tests/hardware/build_installed.py --consumer mnnvl --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/orbite-installed-mnnvl"
      - name: Build packaged caller-stream copy gate without running the GPU workload
        if: matrix.features == 'cuda'
        run: python3 tests/hardware/build_installed.py --consumer local-copy --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/orbite-installed-local-copy"
      - name: Check shared cudarc with an independent consumer
        if: matrix.toolchain == 'stable' && matrix.features == 'cuda'
        run: |
          library=("$RUNNER_TEMP"/orbite-installed-mnnvl/crate/orbite-*)
          consumer="$RUNNER_TEMP/shared-cudarc"
          cargo new --lib --vcs none "$consumer"
          printf 'orbite = { path = "%s", features = ["cuda"] }\n' "${library[0]}" >> "$consumer/Cargo.toml"
          cp tests/reference/raw_stream.rs "$consumer/src/lib.rs"
          cd "$consumer"
          cp "${library[0]}/Cargo.lock" Cargo.lock
          cargo check --offline
          echo 'cudarc = { version = "=0.19.8", features = ["cuda-13000"] }' >> Cargo.toml
          cargo generate-lockfile
          cargo check --locked
          cargo metadata --locked --format-version 1 | jq -e '[.packages[] | select(.name == "cudarc") | .version] == ["0.19.8"]'
      - name: Repeat shared mapping lifetime and process controls 50 times
        if: matrix.toolchain == 'stable' && (matrix.features == '' || matrix.features == 'rdma,cuda,io-uring,gds,metrics')
        run: |
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          count=$("$binary" --list | awk '/^transport::shm::tests::.*: test$/ && !/::shm_child:/ {n++} /::source_close_fences_shm_before_an_unrelated_admission_finishes: test$/ {n++} END {print n+0}')
          test "$count" -ge 10
          for i in $(seq 1 50); do
            RUST_TEST_THREADS=$(nproc) "$binary" transport::shm::tests:: source_close_fences_shm_before_an_unrelated_admission_finishes | tee "$RUNNER_TEMP/shm-lifetime.log"
            grep -Fq "test result: ok. $count passed; 0 failed; 1 ignored;" "$RUNNER_TEMP/shm-lifetime.log"
          done
      - name: Repeat HP-TCP socket and ownership controls 50 times
        if: matrix.toolchain == 'stable' && (matrix.features == '' || matrix.features == 'rdma,cuda,io-uring,gds,metrics')
        run: |
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          count=$("$binary" --list | awk '/^transport::hp_tcp::tests::.*: test$|::hp_worker_failure_preserves_an_already_completed_batch: test$|::hp_tcp_rejects_device_memory_and_consumes_pinned_host_readiness: test$/ {n++} END {print n+0}')
          test "$count" -ge 18
          for i in $(seq 1 50); do
            RUST_TEST_THREADS=$(nproc) "$binary" transport::hp_tcp::tests:: hp_worker_failure_preserves_an_already_completed_batch hp_tcp_rejects_device_memory_and_consumes_pinned_host_readiness | tee "$RUNNER_TEMP/hp-tcp.log"
            grep -Fq "test result: ok. $count passed; 0 failed;" "$RUNNER_TEMP/hp-tcp.log"
          done
      - name: Repeat retirement and Pin controls 50 times
        if: matrix.toolchain == 'stable' && matrix.features == 'rdma,cuda,io-uring'
        run: |
          set -o pipefail
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          tests=(
            cuda::tests::retirement_progress::pending_native_retirement_observes_other_cross_error_stop_and_deadline
            transport::rdma::cq_lane::tests::retirement::poll_retirement_keeps_native_owners_until_close_or_retention_receipt
            cuda::tests::remote_staging::pin_rejects_non_cuda_opt_out_and_source_permission_before_allocation
            runtime::control_plane::tests::pin_requires_the_last_hello_byte_before_replying_to_an_invalid_region
          )
          for iteration in $(seq 1 50); do
            echo "Iteration $iteration/50, RUST_TEST_THREADS=$RUST_TEST_THREADS"
            "$binary" --exact "${tests[@]}" | tee "$RUNNER_TEMP/timing-controls.log"
            grep -Fq "test result: ok. ${#tests[@]} passed; 0 failed;" "$RUNNER_TEMP/timing-controls.log"
          done
          echo "All four controls passed 50/50 on Linux with RUST_TEST_THREADS=$RUST_TEST_THREADS." >> "$GITHUB_STEP_SUMMARY"
      - name: Repeat progress, notification and admission controls 50 times and batch release 200 times
        if: matrix.toolchain == 'stable' && matrix.features == 'rdma,cuda,io-uring,gds'
        run: |
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          .github/scripts/repeat-runtime-controls.sh "$binary"
          .github/scripts/repeat-runtime-controls.sh "$binary" batch-release
          .github/scripts/repeat-runtime-controls.sh "$binary" rail-recovery
      - name: Repeat GDS reservation release at suite parallelism
        if: matrix.features == 'rdma,cuda,io-uring,gds'
        run: |
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          for i in $(seq 1 200); do
            RUST_TEST_THREADS=$(nproc) "$binary" --exact transport::gds::tests::deferred_sweep_skips_permanent_destroy_and_reclaims_independent_work > "$RUNNER_TEMP/gds-reservation.log" 2>&1 || { cat "$RUNNER_TEMP/gds-reservation.log"; exit 1; }
            grep -F "test result: ok. 1 passed; 0 failed;" "$RUNNER_TEMP/gds-reservation.log"
          done
      - name: Repeat Linux shared quota and receiver credit controls 50 times
        if: matrix.toolchain == 'stable' && matrix.features == 'rdma,cuda,io-uring,gds,metrics'
        run: |
          test "$(findmnt -n -o FSTYPE -T /dev/shm)" = tmpfs
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          .github/scripts/repeat-runtime-controls.sh "$binary" quotas
      - name: Parse a real TENT metrics scrape
        if: matrix.features == 'metrics'
        run: |
          python3 -m venv "$RUNNER_TEMP/metrics-parser"
          "$RUNNER_TEMP/metrics-parser/bin/pip" install prometheus-client==0.22.1
          cargo build --locked --features metrics --example metrics_overhead
          "$RUNNER_TEMP/metrics-parser/bin/python" tests/metrics/scrape.py target/debug/examples/metrics_overhead
      - name: Measure CPU and TCP submission with metrics off, disabled and enabled
        if: matrix.toolchain == 'stable' && matrix.features == 'metrics'
        run: python3 tests/metrics/benchmark.py
      - name: Repeat metrics controls 50 times and port rebind 200 times
        if: matrix.toolchain == 'stable' && matrix.features == 'rdma,cuda,io-uring,gds,metrics'
        run: |
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          .github/scripts/repeat-runtime-controls.sh "$binary" metrics
          .github/scripts/repeat-runtime-controls.sh "$binary" metrics-port
      - name: RDMA interruption relay protocol boundary
        if: contains(matrix.features, 'rdma')
        run: cargo test --locked --features "$ORBITE_FEATURES" --example rdma_host relay_tracks_the_public_engines_current_wire
      - name: CPU trace fixture and comparator controls
        run: python3 tests/reference/run.py --rust-only --output "$RUNNER_TEMP/orbite-cpu-trace-${{ matrix.toolchain }}"
      - name: Native peer supervision ownership control
        if: matrix.toolchain == 'stable' && matrix.features == ''
        run: python3 -B -m unittest discover -s tests/hardware -p 'test_*.py'
      - name: Package
        run: cargo publish --dry-run --locked --features "$ORBITE_FEATURES"
      - name: Stress submit rejection and per-owner failover accounting
        if: matrix.features == 'rdma,cuda,io-uring,gds,metrics,rdma-adaptive'
        run: |
          binary=$(cargo test --locked --features "$ORBITE_FEATURES" --lib --no-run --message-format=json |
            jq -ers 'map(select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null)) | last.executable')
          python3 tests/failover/stress.py --binary "$binary" --iterations 2500 \
            --jobs 4 --cpu-load 2 --test-threads 64 --output "$RUNNER_TEMP/failover-stress"
      - name: Preserve failover stress diagnostics
        if: always() && matrix.features == 'rdma,cuda,io-uring,gds,metrics,rdma-adaptive'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failover-stress-${{ matrix.toolchain }}
          path: ${{ runner.temp }}/failover-stress/
      - name: Install public host consumer from packaged crate
        if: matrix.features == 'rdma'
        run: python3 tests/hardware/build_installed.py --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/orbite-installed-host-$RUSTUP_TOOLCHAIN"
      - name: Preserve installed host artifact
        if: always() && matrix.features == 'rdma'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installed-host-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/orbite-installed-host-${{ matrix.toolchain }}/manifest.json
            ${{ runner.temp }}/orbite-installed-host-${{ matrix.toolchain }}/*.stdout
            ${{ runner.temp }}/orbite-installed-host-${{ matrix.toolchain }}/*.stderr
            ${{ runner.temp }}/orbite-installed-host-${{ matrix.toolchain }}/*.crate
            ${{ runner.temp }}/orbite-installed-host-${{ matrix.toolchain }}/*.so
            ${{ runner.temp }}/orbite-installed-host-${{ matrix.toolchain }}/discovery_inventory.py
            ${{ runner.temp }}/orbite-installed-host-${{ matrix.toolchain }}/consumer/Cargo.lock
            ${{ runner.temp }}/orbite-installed-host-${{ matrix.toolchain }}/installed/bin/orbite-rdma-host
      - name: Install public GPU consumer from packaged crate
        if: matrix.features == 'rdma,cuda'
        run: python3 tests/hardware/build_installed.py --consumer gpu --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/orbite-installed-gpu-$RUSTUP_TOOLCHAIN"
      - name: Preserve installed GPU artifact
        if: always() && matrix.features == 'rdma,cuda'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installed-gpu-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/orbite-installed-gpu-${{ matrix.toolchain }}/manifest.json
