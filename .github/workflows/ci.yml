name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.85.0']
        features: ['', rdma, cuda, 'rdma,cuda', io-uring, 'cuda,io-uring', 'rdma,cuda,io-uring', gds, 'gds,io-uring', 'rdma,cuda,io-uring,gds']
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      ORBITTE_FEATURES: ${{ matrix.features }}
      CC: gcc
      CXX: g++
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CLANG_PATH: /usr/bin/clang-18
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Install RDMA binding prerequisites
        if: contains(matrix.features, 'rdma')
        timeout-minutes: 10
        run: .github/scripts/install-native-deps.sh g++ cmake pkg-config clang-18 libclang-18-dev libibverbs-dev
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --locked --features "$ORBITTE_FEATURES"
      - name: Check portable build and Linux-only features
        if: matrix.features == ''
        run: |
          target=aarch64-apple-darwin
          rustup target add "$target"
          cargo check --locked --target "$target" --no-default-features
          for features in rdma cuda rdma,cuda io-uring cuda,io-uring rdma,cuda,io-uring gds gds,io-uring rdma,cuda,io-uring,gds; do
            log="$RUNNER_TEMP/non-linux-$features.log"
            if cargo check --locked --target "$target" --features "$features" >"$log" 2>&1; then
              echo "unexpected success for $target with $features"
              exit 1
            fi
            if ! grep -Eq '^error: OrbitTE.*features require a Linux target$' "$log" || grep -q '^error\[' "$log"; then
              cat "$log"
              exit 1
            fi
          done
      - name: Check file provider isolation
        if: "!contains(matrix.features, 'io-uring')"
        run: |
          cargo tree --locked --features "$ORBITTE_FEATURES" -e normal,build > "$RUNNER_TEMP/deps.txt"
          if grep -F 'io-uring v' "$RUNNER_TEMP/deps.txt"; then exit 1; fi
      - name: Prepare real ext4 and tmpfs for file providers
        if: contains(matrix.features, 'io-uring') || contains(matrix.features, 'gds')
        run: |
          if [[ "$ORBITTE_FEATURES" == *io-uring* ]] && test -e /proc/sys/kernel/io_uring_disabled; then sudo sysctl -w kernel.io_uring_disabled=0; fi
          ext="$RUNNER_TEMP/orbitte-ext4"
          mkdir -p "$ext"
          if test "$(findmnt -n -o FSTYPE -T "$ext")" != ext4; then
            truncate -s 64M "$RUNNER_TEMP/ext4.img"
            mkfs.ext4 -q -F "$RUNNER_TEMP/ext4.img"
            sudo mount -o loop "$RUNNER_TEMP/ext4.img" "$ext"
            sudo chown "$(id -u):$(id -g)" "$ext"
          fi
          test "$(findmnt -n -o FSTYPE -T "$ext")" = ext4
          test "$(findmnt -n -o FSTYPE -T /dev/shm)" = tmpfs
          echo "ORBITTE_EXT4_DIR=$ext" >> "$GITHUB_ENV"
          echo "ORBITTE_TMPFS_DIR=/dev/shm" >> "$GITHUB_ENV"
          if [[ "$ORBITTE_FEATURES" == *io-uring* ]]; then echo "ORBITTE_REQUIRE_IO_URING=1" >> "$GITHUB_ENV"; fi
      - name: Clippy
        run: cargo clippy --locked --features "$ORBITTE_FEATURES" --all-targets -- -D warnings
      - name: Test CPU TCP and ownership
        run: cargo test --locked --features "$ORBITTE_FEATURES"
      - name: RDMA interruption relay protocol boundary
        if: contains(matrix.features, 'rdma')
        run: cargo test --locked --features "$ORBITTE_FEATURES" --example rdma_host relay_tracks_the_public_engines_current_wire
      - name: CPU trace fixture and comparator controls
        run: python3 tests/reference/run.py --rust-only --output "$RUNNER_TEMP/orbitte-cpu-trace-${{ matrix.toolchain }}"
      - name: Native peer supervision ownership control
        if: matrix.toolchain == 'stable' && matrix.features == ''
        run: python3 -B -m unittest discover -s tests/hardware -p 'test_*.py'
      - name: Package
        run: cargo publish --dry-run --locked --features "$ORBITTE_FEATURES"
      - name: Install public host consumer from packaged crate
        if: matrix.features == 'rdma'
        run: python3 tests/hardware/build_installed.py --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/orbitte-installed-host-$RUSTUP_TOOLCHAIN"
      - name: Preserve installed host artifact
        if: always() && matrix.features == 'rdma'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installed-host-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/manifest.json
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/*.stdout
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/*.stderr
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/*.crate
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/*.so
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/discovery_inventory.py
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/consumer/Cargo.lock
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/installed/bin/orbitte-rdma-host
      - name: Install public GPU consumer from packaged crate
        if: matrix.features == 'rdma,cuda'
        run: python3 tests/hardware/build_installed.py --consumer gpu --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/orbitte-installed-gpu-$RUSTUP_TOOLCHAIN"
      - name: Preserve installed GPU artifact
        if: always() && matrix.features == 'rdma,cuda'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installed-gpu-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/orbitte-installed-gpu-${{ matrix.toolchain }}/manifest.json
            ${{ runner.temp }}/orbitte-installed-gpu-${{ matrix.toolchain }}/*.stdout
            ${{ runner.temp }}/orbitte-installed-gpu-${{ matrix.toolchain }}/*.stderr
            ${{ runner.temp }}/orbitte-installed-gpu-${{ matrix.toolchain }}/*.crate
            ${{ runner.temp }}/orbitte-installed-gpu-${{ matrix.toolchain }}/*.so
            ${{ runner.temp }}/orbitte-installed-gpu-${{ matrix.toolchain }}/consumer/Cargo.lock
            ${{ runner.temp }}/orbitte-installed-gpu-${{ matrix.toolchain }}/installed/bin/orbitte-hardware-peer
      - name: Install public CUDA IPC consumer from packaged crate
        if: matrix.features == 'cuda'
        run: python3 tests/hardware/build_installed.py --consumer nvlink --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/orbitte-installed-nvlink-$RUSTUP_TOOLCHAIN"
      - name: Preserve installed CUDA IPC artifact
        if: always() && matrix.features == 'cuda'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installed-nvlink-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/orbitte-installed-nvlink-${{ matrix.toolchain }}/manifest.json
            ${{ runner.temp }}/orbitte-installed-nvlink-${{ matrix.toolchain }}/*.stdout
            ${{ runner.temp }}/orbitte-installed-nvlink-${{ matrix.toolchain }}/*.stderr
            ${{ runner.temp }}/orbitte-installed-nvlink-${{ matrix.toolchain }}/*.crate
            ${{ runner.temp }}/orbitte-installed-nvlink-${{ matrix.toolchain }}/*.so
            ${{ runner.temp }}/orbitte-installed-nvlink-${{ matrix.toolchain }}/nvlink_run.py
            ${{ runner.temp }}/orbitte-installed-nvlink-${{ matrix.toolchain }}/consumer/Cargo.lock
            ${{ runner.temp }}/orbitte-installed-nvlink-${{ matrix.toolchain }}/installed/bin/orbitte-nvlink
      - name: Install public CUDA file consumer from packaged crate
        if: matrix.features == 'cuda,io-uring'
        run: python3 tests/hardware/build_installed.py --consumer storage-cuda --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/orbitte-installed-storage-cuda-$RUSTUP_TOOLCHAIN"
      - name: Preserve installed CUDA file artifact
        if: always() && matrix.features == 'cuda,io-uring'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installed-storage-cuda-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/orbitte-installed-storage-cuda-${{ matrix.toolchain }}/manifest.json
            ${{ runner.temp }}/orbitte-installed-storage-cuda-${{ matrix.toolchain }}/*.stdout
            ${{ runner.temp }}/orbitte-installed-storage-cuda-${{ matrix.toolchain }}/*.stderr
            ${{ runner.temp }}/orbitte-installed-storage-cuda-${{ matrix.toolchain }}/*.crate
            ${{ runner.temp }}/orbitte-installed-storage-cuda-${{ matrix.toolchain }}/storage_cuda_run.py
            ${{ runner.temp }}/orbitte-installed-storage-cuda-${{ matrix.toolchain }}/consumer/Cargo.lock
            ${{ runner.temp }}/orbitte-installed-storage-cuda-${{ matrix.toolchain }}/installed/bin/orbitte-storage-cuda

      - name: Install public GDS consumer from packaged crate
        if: matrix.features == 'gds'
        run: python3 tests/hardware/build_installed.py --consumer gds --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/orbitte-installed-gds-$RUSTUP_TOOLCHAIN"
      - name: Preserve installed GDS artifact
        if: always() && matrix.features == 'gds'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installed-gds-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/orbitte-installed-gds-${{ matrix.toolchain }}/manifest.json
            ${{ runner.temp }}/orbitte-installed-gds-${{ matrix.toolchain }}/*.stdout
            ${{ runner.temp }}/orbitte-installed-gds-${{ matrix.toolchain }}/*.stderr
            ${{ runner.temp }}/orbitte-installed-gds-${{ matrix.toolchain }}/*.crate
            ${{ runner.temp }}/orbitte-installed-gds-${{ matrix.toolchain }}/*_run.py
            ${{ runner.temp }}/orbitte-installed-gds-${{ matrix.toolchain }}/consumer/Cargo.lock
            ${{ runner.temp }}/orbitte-installed-gds-${{ matrix.toolchain }}/installed/bin/orbitte-gds
