name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.85.0']
        features: ['', rdma, cuda, 'rdma,cuda']
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      ORBITTE_FEATURES: ${{ matrix.features }}
      CC: gcc
      CXX: g++
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CLANG_PATH: /usr/bin/clang-18
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Install RDMA binding prerequisites
        if: contains(matrix.features, 'rdma')
        timeout-minutes: 10
        run: .github/scripts/install-native-deps.sh g++ cmake pkg-config clang-18 libclang-18-dev libibverbs-dev
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --locked --features "$ORBITTE_FEATURES"
      - name: Clippy
        run: cargo clippy --locked --features "$ORBITTE_FEATURES" --all-targets -- -D warnings
      - name: Test CPU TCP and ownership
        run: cargo test --locked --features "$ORBITTE_FEATURES"
      - name: CPU trace fixture and comparator controls
        run: python3 tests/reference/run.py --rust-only --output "$RUNNER_TEMP/orbitte-cpu-trace-${{ matrix.toolchain }}"
      - name: Native peer supervision ownership control
        if: matrix.toolchain == 'stable' && matrix.features == ''
        run: python3 -B -m unittest discover -s tests/hardware -p 'test_*.py'
      - name: Package
        run: cargo publish --dry-run --locked --features "$ORBITTE_FEATURES"
      - name: Install public host consumer from packaged crate
        if: matrix.features == 'rdma'
        run: python3 tests/hardware/build_installed.py --toolchain "$RUSTUP_TOOLCHAIN" --output "$RUNNER_TEMP/orbitte-installed-host-$RUSTUP_TOOLCHAIN"
      - name: Preserve installed host artifact
        if: always() && matrix.features == 'rdma'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installed-host-${{ matrix.toolchain }}
          path: |
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/manifest.json
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/*.stdout
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/*.stderr
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/*.crate
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/*.so
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/consumer/Cargo.lock
            ${{ runner.temp }}/orbitte-installed-host-${{ matrix.toolchain }}/installed/bin/orbitte-rdma-host
