name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned documentation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/orbitte-docs-venv"
          "$RUNNER_TEMP/orbitte-docs-venv/bin/pip" install --disable-pip-version-check -r docs/requirements.txt
      - name: Build the website with warnings treated as errors
        env:
          ORBITTE_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          "$RUNNER_TEMP/orbitte-docs-venv/bin/sphinx-build"
          -n -W --keep-going docs "$RUNNER_TEMP/orbitte-docs/html"
      - name: Check local links, fragments and assets
        run: python3 scripts/check-docs.py "$RUNNER_TEMP/orbitte-docs/html"
      - name: Save the generated website for preview
        uses: actions/upload-artifact@v7.0.2
        with:
          name: orbitte-docs
          path: ${{ runner.temp }}/orbitte-docs/html/
          include-hidden-files: true
          if-no-files-found: error
      - name: Configure GitHub Pages
        if: github.repository == 'OrbitInfra/OrbitTE' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6.0.0
      - name: Upload the Pages artifact
        if: github.repository == 'OrbitInfra/OrbitTE' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/orbitte-docs/html/

  deploy:
    if: github.repository == 'OrbitInfra/OrbitTE' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
