[package]
name = "orbit-te"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
authors = ["OrbitInfra", "feichai0017 <songguocheng348@gmail.com>"]
description = "OrbitTE: a Rust-native transfer engine for AI infrastructure (early development)"
license = "Apache-2.0"
repository = "https://github.com/OrbitInfra/OrbitTE"
homepage = "https://github.com/OrbitInfra/OrbitTE"
readme = "README.md"
keywords = ["rdma", "transfer", "distributed", "ai", "memory"]
categories = ["network-programming"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
publish = ["crates-io"]

[lib]
name = "orbit_te"
path = "src/lib.rs"
