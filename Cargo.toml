[package]
name = "orbit-te"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
authors = ["OrbitInfra", "feichai0017 <songguocheng348@gmail.com>"]
description = "OrbitTE: a Rust-native transfer engine for AI infrastructure (early development)"
license = "Apache-2.0"
repository = "https://github.com/OrbitInfra/OrbitTE"
homepage = "https://github.com/OrbitInfra/OrbitTE"
readme = "README.md"
keywords = ["rdma", "transfer", "distributed", "ai", "memory"]
categories = ["network-programming"]
include = ["src/**", "tests/**", "examples/**", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "!**/__pycache__/**", "!**/*.pyc"]
publish = ["crates-io"]

[features]
default = []
rdma = ["dep:ibverbs-sys", "dep:libc"]
cuda = ["dep:cudarc", "dep:libloading"]

[dependencies]
# 0.19.0 retains libloading 0.8 and the Rust 1.85 baseline.
cudarc = { version = "=0.19.0", optional = true, default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-12000"] }
libloading = { version = "0.8", optional = true }
ibverbs-sys = { version = "=0.3.2", optional = true }
libc = { version = "0.2", optional = true }

[lib]
name = "orbit_te"
path = "src/lib.rs"

[[example]]
name = "cpu_trace"
path = "tests/reference/rust_driver.rs"

[[example]]
name = "hardware_peer"
path = "examples/hardware_peer.rs"
required-features = ["rdma", "cuda"]

[[example]]
name = "rdma_host"
path = "tests/hardware/rdma_host.rs"
required-features = ["rdma"]

[[example]]
name = "cuda_copy"
path = "tests/hardware/cuda_copy.rs"
required-features = ["cuda"]

[[example]]
name = "nvlink"
path = "tests/hardware/nvlink.rs"
required-features = ["cuda"]
