[workspace]
members = ["crates/orbite-python"]
default-members = ["."]
resolver = "3"

[package]
name = "orbite"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
authors = ["OrbitInfra", "feichai0017 <songguocheng348@gmail.com>"]
description = "OrbiTE: a Rust-native transfer engine for AI infrastructure (early development)"
license = "Apache-2.0"
repository = "https://github.com/OrbitInfra/OrbiTE"
homepage = "https://github.com/OrbitInfra/OrbiTE"
documentation = "https://orbitinfra.github.io/OrbiTE/"
readme = "README.md"
keywords = ["rdma", "transfer", "distributed", "ai", "memory"]
categories = ["network-programming"]
include = ["build.rs", "src/**", "benches/**", "tests/**", "examples/**", "docs/**", "python/**", "pyproject.toml", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "!**/__pycache__/**", "!**/*.pyc"]
publish = ["crates-io"]

[features]
default = []
rdma = ["dep:cc", "dep:bindgen", "dep:ibverbs-sys", "dep:libloading"]
cuda = ["dep:cudarc", "dep:libloading", "dep:socket2"]
io-uring = ["dep:io-uring"]
gds = ["cuda"]
metrics = []
rdma-adaptive = ["rdma"]
# Headers compile only the inline-vtable bridge; libfabric is loaded at runtime.
fabric = ["dep:cc", "dep:bindgen", "dep:libloading"]

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
mio = { version = "1.2.1", default-features = false, features = ["net", "os-poll"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK lets file segments reject a FIFO even if it replaces a regular file.
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
# SQE/CQE layout and enter semantics are audited for this binding release.
io-uring = { version = "=0.7.11", optional = true }
# The MSRV lock uses 0.19.0. Consumers on newer Rust can unify later 0.19 releases.
cudarc = { version = "0.19.0", optional = true, default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-13000"] }
libloading = { version = "0.8.9", optional = true }
# The verbs shims depend on the generated rdma-core layouts and inline accessors.
ibverbs-sys = { version = "=0.3.2", optional = true }
socket2 = { version = "0.6.4", optional = true }

[build-dependencies]
bindgen = { version = "0.71.1", optional = true }
cc = { version = "1.9.0", optional = true }

[lib]
name = "orbite"
path = "src/lib.rs"

[[example]]
name = "cpu_trace"
path = "tests/reference/rust_driver.rs"

[[example]]
name = "hardware_peer"
path = "examples/hardware_peer.rs"
required-features = ["rdma", "cuda"]

[[example]]
name = "rdma_host"
path = "tests/hardware/rdma_host.rs"
required-features = ["rdma"]

[[example]]
name = "local_copy"
path = "tests/hardware/local_copy.rs"
required-features = ["cuda"]

[[example]]
name = "cuda_copy"
path = "tests/hardware/cuda_copy.rs"
required-features = ["cuda"]

[[example]]
name = "nvlink"
path = "tests/hardware/nvlink.rs"
required-features = ["cuda"]

[[example]]
name = "mnnvl"
path = "tests/hardware/mnnvl.rs"
required-features = ["cuda"]

[[example]]
name = "mixed_gpu"
path = "tests/hardware/mixed_gpu.rs"
required-features = ["rdma", "cuda"]

[[example]]
name = "staging_control"
path = "tests/hardware/staging_control.rs"
required-features = ["rdma", "cuda"]

[[example]]
name = "storage_cuda"
path = "tests/hardware/storage_cuda.rs"
required-features = ["cuda", "io-uring"]

[[example]]
name = "gds"
path = "tests/hardware/gds.rs"
required-features = ["gds"]

[[example]]
name = "shm"
path = "tests/hardware/shm.rs"

[[example]]
name = "hp_tcp"
path = "tests/hardware/hp_tcp.rs"

[[example]]
name = "metrics_overhead"
path = "tests/metrics/overhead.rs"

[[example]]
name = "peer_gpu_source"
path = "tests/hardware/peer_gpu_source.rs"
required-features = ["cuda"]

[[example]]
name = "peer_gpu_requester"
path = "tests/hardware/peer_gpu_requester.rs"

[[example]]
name = "fabric"
path = "tests/hardware/fabric.rs"
required-features = ["fabric"]

[[bench]]
name = "transfer"
path = "benches/transfer.rs"
harness = false

[[example]]
name = "gds_p10"
path = "tests/hardware/gds_p10.rs"
required-features = ["gds"]
